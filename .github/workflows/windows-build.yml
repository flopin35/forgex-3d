name: Windows build

# Builds FORGEX 3D.exe, the Windows installer and the MCP server on a Windows machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests, including the FORGEX Cube Test and the MCP server
        run: npm test

      - name: Build the MCP server
        run: npm run mcp:build

      - name: Build the desktop app and installer
        run: npm run desktop:build

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/forgex-3d.exe "release/FORGEX 3D.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item package-lock.json release/
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: forgex-3d-windows
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: forgex-mcp-server
          path: mcp/dist/
          if-no-files-found: error
