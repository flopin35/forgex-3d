name: Windows build

# Builds FORGEX 3D.exe, the Windows installer and the MCP server on a Windows machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests, including the FORGEX Cube Test and the MCP server
        shell: bash
        run: |
          npm test 2>&1 | tee test-report.txt
          exit ${PIPESTATUS[0]}

      - name: Build the MCP server
        run: npm run mcp:build

      - name: Build the desktop app and installer
        run: npm run desktop:build

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/forgex-3d.exe "release/FORGEX 3D.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item package-lock.json release/
          Copy-Item test-report.txt release/
          Get-ChildItem release | Format-Table Name, Length

      - name: Publish a download page (GitHub release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File -Filter *.exe | ForEach-Object { $_.FullName }
          gh release create "build-${{ github.run_number }}" $files `
            --target "${{ github.sha }}" --prerelease `
            --title "FORGEX 3D build ${{ github.run_number }}" `
            --notes "Windows build from commit ${{ github.sha }}. FORGEX.3D.exe runs directly; the setup file installs it with a Start menu entry. The app is not code-signed: if Windows SmartScreen appears, choose More info, then Run anyway."

      - name: Store build files on the builds branch
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'builds'
          New-Item -ItemType Directory -Force $dir, "$dir/mcp-dist", "$dir/web" | Out-Null
          Copy-Item release/* $dir
          Copy-Item -Recurse mcp/dist/* "$dir/mcp-dist"
          # The web build of the same app, for browser previews and UI checks.
          Copy-Item -Recurse dist/* "$dir/web"
          Set-Location $dir
          git init -q -b builds
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Build ${{ github.run_number }} from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

      - uses: actions/upload-artifact@v4
        with:
          name: forgex-3d-windows
          path: release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: forgex-mcp-server
          path: mcp/dist/
          if-no-files-found: error
